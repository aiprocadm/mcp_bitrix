# Профиль для VPS (ТЗ §17.6). До этапа 12 (OAuth MCP) порт публикуется только на loopback:
# наружу сервер выставляется через HTTPS reverse proxy и только с MCP_AUTH_MODE=oauth.
# Один экземпляр: второй контейнер на той же базе запрещён (нет общей блокировки и лимитера).
services:
  bitrix24-mcp:
    build: .
    restart: unless-stopped
    user: mcp
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    # До этапа 12 (OAuth MCP) сервер слушает только loopback ХОСТА через host-сеть: публикации порта нет,
    # снаружи недоступен, владелец подключается через SSH-туннель. Внешний интерфейс при MCP_AUTH_MODE=local
    # запрещён самой конфигурацией (CONFIG_INVALID).
    network_mode: host
    volumes:
      - ./config:/app/config:ro # здесь лежит .env (права 600)
      - mcp-data:/app/data # SQLite, ключ, staging, копии — единственный writable том
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 127.0.0.1
      # Порт хоста: `MCP_PORT=3123 docker compose up -d`, если 3000 занят.
      MCP_PORT: ${MCP_PORT:-3000}
      DATA_DIR: /app/data
      DATABASE_URL: file:/app/data/mcp.sqlite
      SECRETS_KEY_FILE: /app/data/secrets/master.key
      UPLOAD_ROOT: /app/data/inbox
      STAGING_DIR: /app/data/staging
      # Рабочие политики живут в томе (config смонтирован только для чтения); setup создаёт их из /app/policies.
      METHOD_POLICY_FILE: /app/data/policies/methods.json
      ACCESS_POLICY_FILE: /app/data/policies/access.json
      OUTPUT_POLICY_FILE: /app/data/policies/output.json
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:${MCP_PORT:-3000}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  mcp-data:
